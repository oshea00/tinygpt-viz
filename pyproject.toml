[project]
name = "tinygpt-viz"
version = "0.1.0"
description = "Step through, generate with, and train a tiny real GPT, seeing every number"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.7",
    "numpy>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "huggingface_hub>=0.26",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
